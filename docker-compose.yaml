services:
  server:
    build:
      context: .
      dockerfile: karazin_networks_server/Dockerfile
    ports:
      - "8080:8080"

  client:
    build:
      context: .
      dockerfile: karazin_networks_client/Dockerfile
      args:
        API_BASE_URL: ${API_BASE_URL:-http://localhost:8080}
    ports:
      - "8081:80"
    depends_on:
      - server
